[package]
name = "ssh-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A small native SSH desktop client"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_term = { path = "vendor/egui_term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
ssh2 = "0.9.6"
base64 = "0.22"
zeroize = "1"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

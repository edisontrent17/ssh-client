[package]
name = "ssh-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A small native SSH desktop client"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_term = { path = "vendor/egui_term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
ssh2 = "0.9.6"
base64 = "0.22"
zeroize = "1"
rfd = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { version = "0.6.2", optional = true }

[build-dependencies]
cc = { version = "1.4.6", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[features]
terminal-fixture = ["egui_term/test-support"]
ghostty = ["dep:raw-window-handle", "dep:cc"]
macos-distribution = ["ghostty", "ssh2/vendored-openssl"]

[[example]]
name = "terminal_bench"
required-features = ["terminal-fixture"]

[[example]]
name = "memory_bench"
required-features = ["terminal-fixture"]

[[example]]
name = "ghostty_smoke"
required-features = ["ghostty", "terminal-fixture"]
